openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: StreamPro — Enterprise TV Streaming Platform API
servers:
  - url: /api/v1
    description: Versioned API base path
tags:
  - name: health
    description: Health check
  - name: auth
    description: Authentication & session management
  - name: users
    description: User management
  - name: channels
    description: Live TV channels
  - name: epg
    description: Electronic Program Guide
  - name: movies
    description: VOD movies
  - name: series
    description: TV series, seasons & episodes
  - name: categories
    description: Content categories
  - name: favorites
    description: User favorites
  - name: watch-history
    description: Watch history & continue-watching
  - name: subscriptions
    description: Plans, coupons & subscriptions
  - name: payments
    description: Payment gateways & transactions
  - name: notifications
    description: Push & in-app notifications
  - name: advertisements
    description: Ad providers, placements & events
  - name: search
    description: Global search
  - name: settings
    description: App settings key-value store
  - name: parental-control
    description: Parental control PIN & restrictions
  - name: analytics
    description: Dashboard KPIs & analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ─────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email/phone + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout (revoke current session)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required: [refreshToken]
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request OTP for password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
              required: [identifier]
      responses:
        "200":
          description: OTP dispatched (response never includes the code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify an OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                code:
                  type: string
                type:
                  type: string
                  enum: [forgot_password, email_verification, phone_verification]
              required: [identifier, code, type]
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password after OTP verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                otpCode:
                  type: string
                newPassword:
                  type: string
              required: [identifier, otpCode, newPassword]
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/profile:
    get:
      operationId: getProfile
      tags: [auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileDto"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password (authenticated)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
              required: [currentPassword, newPassword]
      responses:
        "200":
          description: Password changed

  /auth/social:
    post:
      operationId: socialLogin
      tags: [auth]
      summary: Social login (Google / Apple / Facebook)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum: [google, apple, facebook]
                accessToken:
                  type: string
                email:
                  type: string
                name:
                  type: string
              required: [provider, accessToken]
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  # ── CHANNELS ─────────────────────────────────────────────────────────────
  /channels:
    get:
      operationId: getChannels
      tags: [channels]
      summary: List live TV channels
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: categoryId
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Channel list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedChannels"
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create channel (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelDto"
      responses:
        "201":
          description: Channel created

  /channels/{id}:
    get:
      operationId: getChannel
      tags: [channels]
      summary: Get channel by id
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
    patch:
      operationId: updateChannel
      tags: [channels]
      summary: Update channel (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelDto"
      responses:
        "200":
          description: Updated channel
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: Delete channel (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Deleted

  # ── EPG ──────────────────────────────────────────────────────────────────
  /epg:
    get:
      operationId: getEpg
      tags: [epg]
      summary: Get EPG entries
      parameters:
        - name: channelId
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: EPG entries

  /epg/now:
    get:
      operationId: getNowPlaying
      tags: [epg]
      summary: Get currently-airing programs
      responses:
        "200":
          description: Now-playing list

  # ── MOVIES ───────────────────────────────────────────────────────────────
  /movies:
    get:
      operationId: getMovies
      tags: [movies]
      summary: List movies
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: categoryId
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: featured
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Movie list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMovies"
    post:
      operationId: createMovie
      tags: [movies]
      summary: Create movie (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMovieDto"
      responses:
        "201":
          description: Movie created

  /movies/trending:
    get:
      operationId: getTrendingMovies
      tags: [movies]
      summary: Get trending movies
      responses:
        "200":
          description: Trending list

  /movies/featured:
    get:
      operationId: getFeaturedMovies
      tags: [movies]
      summary: Get featured movies
      responses:
        "200":
          description: Featured list

  /movies/{id}:
    get:
      operationId: getMovie
      tags: [movies]
      summary: Get movie by id
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Movie
    patch:
      operationId: updateMovie
      tags: [movies]
      summary: Update movie (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMovieDto"
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteMovie
      tags: [movies]
      summary: Delete movie (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Deleted

  # ── SERIES ───────────────────────────────────────────────────────────────
  /series:
    get:
      operationId: getSeries
      tags: [series]
      summary: List series
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Series list
    post:
      operationId: createSeries
      tags: [series]
      summary: Create series (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeriesDto"
      responses:
        "201":
          description: Series created

  /series/{id}:
    get:
      operationId: getSeriesById
      tags: [series]
      summary: Get series by id
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Series detail

  /series/{id}/seasons:
    get:
      operationId: getSeasons
      tags: [series]
      summary: List seasons for a series
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Season list

  /series/{id}/seasons/{seasonNumber}/episodes:
    get:
      operationId: getEpisodes
      tags: [series]
      summary: List episodes for a season
      parameters:
        - $ref: "#/components/parameters/id"
        - name: seasonNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Episode list

  # ── CATEGORIES ───────────────────────────────────────────────────────────
  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: List categories
      responses:
        "200":
          description: Category list
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create category (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                type:
                  type: string
                  enum: [channel, movie, series]
              required: [name, slug, type]
      responses:
        "201":
          description: Created

  # ── FAVORITES ────────────────────────────────────────────────────────────
  /favorites:
    get:
      operationId: getFavorites
      tags: [favorites]
      summary: Get user favorites
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Favorites list
    post:
      operationId: addFavorite
      tags: [favorites]
      summary: Add to favorites
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [channel, movie, series]
                id:
                  type: string
              required: [type, id]
      responses:
        "201":
          description: Added

  /favorites/{type}/{id}:
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: Remove from favorites
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Removed

  # ── WATCH HISTORY ────────────────────────────────────────────────────────
  /watch-history:
    get:
      operationId: getWatchHistory
      tags: [watch-history]
      summary: Get watch history
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: History list
    post:
      operationId: addWatchHistory
      tags: [watch-history]
      summary: Record watch progress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentType:
                  type: string
                  enum: [channel, movie, episode]
                contentId:
                  type: string
                progress:
                  type: number
                  description: Progress in seconds
              required: [contentType, contentId]
      responses:
        "201":
          description: Recorded

  /watch-history/continue:
    get:
      operationId: getContinueWatching
      tags: [watch-history]
      summary: Get continue-watching list
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Continue-watching list

  # ── SUBSCRIPTIONS ────────────────────────────────────────────────────────
  /subscriptions/plans:
    get:
      operationId: getPlans
      tags: [subscriptions]
      summary: List subscription plans
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Plan list
    post:
      operationId: createPlan
      tags: [subscriptions]
      summary: Create plan (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanDto"
      responses:
        "201":
          description: Plan created

  /subscriptions/me:
    get:
      operationId: getMySubscription
      tags: [subscriptions]
      summary: Get current user's active subscription
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription or null

  /subscriptions:
    post:
      operationId: subscribe
      tags: [subscriptions]
      summary: Create subscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planId:
                  type: string
                paymentReference:
                  type: string
                couponCode:
                  type: string
              required: [planId]
      responses:
        "201":
          description: Subscription created

  /subscriptions/verify:
    post:
      operationId: verifyPayment
      tags: [subscriptions]
      summary: Verify payment and activate subscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference:
                  type: string
                gateway:
                  type: string
              required: [reference, gateway]
      responses:
        "200":
          description: Verified and activated

  /subscriptions/coupons:
    post:
      operationId: createCoupon
      tags: [subscriptions]
      summary: Create coupon (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCouponDto"
      responses:
        "201":
          description: Coupon created

  /subscriptions/coupons/apply:
    post:
      operationId: applyCoupon
      tags: [subscriptions]
      summary: Apply coupon code
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                planId:
                  type: string
              required: [code, planId]
      responses:
        "200":
          description: Discounted price returned

  # ── PAYMENTS ─────────────────────────────────────────────────────────────
  /payments/gateways:
    get:
      operationId: getGateways
      tags: [payments]
      summary: List payment gateways
      responses:
        "200":
          description: Gateway list

  /payments/transactions:
    get:
      operationId: getTransactions
      tags: [payments]
      summary: List transactions (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Transaction list

  # ── NOTIFICATIONS ────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: List notifications (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Notification list
    post:
      operationId: createNotification
      tags: [notifications]
      summary: Create notification (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationDto"
      responses:
        "201":
          description: Created

  /notifications/{id}/send:
    post:
      operationId: sendNotification
      tags: [notifications]
      summary: Send notification via FCM (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Sent

  /notifications/user:
    get:
      operationId: getUserNotifications
      tags: [notifications]
      summary: Get notifications for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User notification list

  /notifications/user/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Marked read

  /notifications/user/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All marked read

  # ── ADVERTISEMENTS ───────────────────────────────────────────────────────
  /advertisements/providers:
    get:
      operationId: getAdProviders
      tags: [advertisements]
      summary: List ad providers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Provider list

  /advertisements/placements:
    get:
      operationId: getAdPlacements
      tags: [advertisements]
      summary: List ad placements
      parameters:
        - name: country
          in: query
          schema:
            type: string
        - name: device
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Placement list

  /advertisements/events:
    post:
      operationId: trackAdEvent
      tags: [advertisements]
      summary: Track ad event (impression / click / error)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                placementId:
                  type: string
                eventType:
                  type: string
                  enum: [impression, click, error, complete]
              required: [placementId, eventType]
      responses:
        "201":
          description: Event recorded

  # ── SEARCH ───────────────────────────────────────────────────────────────
  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Search across channels, movies and series
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  /search/history:
    get:
      operationId: getSearchHistory
      tags: [search]
      summary: Get user search history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Search history
    delete:
      operationId: clearSearchHistory
      tags: [search]
      summary: Clear user search history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cleared

  /search/trending:
    get:
      operationId: getTrendingSearches
      tags: [search]
      summary: Get top trending searches
      responses:
        "200":
          description: Trending list

  # ── SETTINGS ─────────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all settings
      responses:
        "200":
          description: Settings key-value map
    post:
      operationId: upsertSetting
      tags: [settings]
      summary: Create/update a setting (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                value:
                  type: string
              required: [key, value]
      responses:
        "200":
          description: Upserted

  /settings/{key}:
    get:
      operationId: getSetting
      tags: [settings]
      summary: Get setting by key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Setting value
    delete:
      operationId: deleteSetting
      tags: [settings]
      summary: Delete setting (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  # ── PARENTAL CONTROL ─────────────────────────────────────────────────────
  /parental-control:
    get:
      operationId: getParentalControl
      tags: [parental-control]
      summary: Get parental control settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Parental control config
    put:
      operationId: updateParentalControl
      tags: [parental-control]
      summary: Update parental control (PIN + ratings)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated

  /parental-control/verify-pin:
    post:
      operationId: verifyParentalPin
      tags: [parental-control]
      summary: Verify parental PIN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pin:
                  type: string
              required: [pin]
      responses:
        "200":
          description: PIN correct
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── ANALYTICS ────────────────────────────────────────────────────────────
  /analytics/dashboard:
    get:
      operationId: getDashboard
      tags: [analytics]
      summary: Get admin dashboard KPIs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: KPI summary

  /analytics/revenue:
    get:
      operationId: getRevenue
      tags: [analytics]
      summary: Revenue chart data
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, 1y]
      responses:
        "200":
          description: Revenue data

  /analytics/users:
    get:
      operationId: getUserStats
      tags: [analytics]
      summary: User growth & activity stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User stats

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
      required: [statusCode, message]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required: [accessToken, refreshToken]

    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, admin, moderator]
        isActive:
          type: boolean
        isPremium:
          type: boolean
        emailVerified:
          type: boolean
        phoneVerified:
          type: boolean
        avatar:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        language:
          type: string
      required: [id, name, role, isActive, isPremium]

    UpdateProfileDto:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        language:
          type: string
        country:
          type: string
        avatar:
          type: string

    RegisterDto:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        password:
          type: string
          minLength: 6
      required: [name, password]

    LoginDto:
      type: object
      properties:
        identifier:
          type: string
        password:
          type: string
        deviceName:
          type: string
        deviceType:
          type: string
        platform:
          type: string
      required: [identifier, password]

    Channel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        streamUrl:
          type: string
        logo:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        isActive:
          type: boolean
        sortOrder:
          type: integer
      required: [id, name, slug, streamUrl, isActive]

    CreateChannelDto:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        streamUrl:
          type: string
        logo:
          type: string
        country:
          type: string
        isActive:
          type: boolean
      required: [name, slug, streamUrl]

    PaginatedChannels:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    CreateMovieDto:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        streamUrl:
          type: string
        thumbnail:
          type: string
        poster:
          type: string
        duration:
          type: integer
        releaseYear:
          type: integer
        rating:
          type: string
        isFeatured:
          type: boolean
        categoryIds:
          type: array
          items:
            type: string
      required: [title, slug, streamUrl]

    PaginatedMovies:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    CreateSeriesDto:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        thumbnail:
          type: string
        rating:
          type: string
        categoryIds:
          type: array
          items:
            type: string
      required: [title, slug]

    CreatePlanDto:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        price:
          type: number
        currency:
          type: string
          default: USD
        durationDays:
          type: integer
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean
      required: [name, slug, price, durationDays]

    CreateCouponDto:
      type: object
      properties:
        code:
          type: string
        discountType:
          type: string
          enum: [percentage, fixed]
        discountValue:
          type: number
        maxUses:
          type: integer
        expiresAt:
          type: string
          format: date-time
      required: [code, discountType, discountValue]

    CreateNotificationDto:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        type:
          type: string
          enum: [GENERAL, PROMO, NEWS, ALERT, SYSTEM]
        targetAll:
          type: boolean
        targetRoles:
          type: array
          items:
            type: string
        targetUsers:
          type: array
          items:
            type: string
        country:
          type: string
        language:
          type: string
        isPremium:
          type: boolean
        imageUrl:
          type: string
        deepLink:
          type: string
        scheduledAt:
          type: string
          format: date-time
      required: [title, body]

    SearchResults:
      type: object
      properties:
        query:
          type: string
        channels:
          type: array
          items:
            type: object
        movies:
          type: array
          items:
            type: object
        series:
          type: array
          items:
            type: object
      required: [query, channels, movies, series]

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required: [total, page, limit, totalPages]
